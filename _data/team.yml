# LaBGAS team roster.
#
# Grouped by `role_group`; the Team page renders groups in the order below.
# `photo` is a filename in assets/images/team/ — when absent the page falls
# back to an initials avatar, so adding a photo is a one-line change.
# `focus` is filled in only where it is supported by first-authored work;
# entries marked TODO are left for the lab to complete.

groups:
  - id: pi
    label: "Principal investigator"
  - id: guest
    label: "Guest professors"
  - id: coordinator
    label: "Research coordination"
  - id: postdoc
    label: "Post-doctoral researchers"
  - id: phd
    label: "PhD students"
  - id: students
    label: "Master's & medical students"
  - id: alumni
    label: "Alumni"

members:
  # --- PI --------------------------------------------------------------
  - name: "Lukas Van Oudenhove"
    photo: lukas-van-oudenhove.jpg
    group: pi
    title: "Research Professor, head of LaBGAS"
    focus: >-
      Psychiatrist and gut-brain researcher. Psychobiological mechanisms of
      gastrointestinal symptom perception, gut-brain control of appetite and
      food intake, and the influence of nutrient- and microbiota-related gut
      signals on affect and cognition.
    email: "lukas.vanoudenhove@kuleuven.be"
    orcid: "0000-0002-6540-3113"
    scholar: "https://scholar.google.com/citations?user=xYPdgr8AAAAJ"
    kuleuven: "https://gbiomed.kuleuven.be/english/research/50000625/50000628/labgas/staff-folder/labgasmembers/00027997"
    github: "lukasvo76"

  # --- Guest professors -------------------------------------------------
  - name: "Livia Guadagnoli"
    group: guest
    title: "Guest professor"
    focus: >-
      Psychogastroenterology; behavioural treatment for avoidant/restrictive
