# Seed list for the curated Publications page.
#
# Titles were selected from the full FRIS record for Lukas Van Oudenhove
# (researchportal.be, 305 items) as representative of each research line.
# `scripts/enrich_publications.py` resolves each title against PubMed and
# writes _data/publications.yml with authors, journal, year, PMID and DOI.
#
# To add a paper: append a title under the right line and re-run the script.
# lines: symptoms | appetite | microbiota | methods

