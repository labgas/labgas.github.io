# Rebuilds the curated publication highlights whenever their seed list changes.
#
# Approving a paper for a research line means adding its title to
# scripts/curated_titles.yml — in the browser, typically straight from the issue
# the daily workflow opens for new papers. This runs enrich_publications.py on
# that push and commits the regenerated _data/publications.yml, so nobody has to
# run anything locally.
#
# enrich_publications.py reports titles it could not resolve but still exits 0,
# writing them with no metadata. A PubMed hiccup would therefore strip good
# entries down to bare titles, so any reported problem fails the run instead of
# committing: the page keeps its previous version, and the run log says which
# title to look at. Re-run it from the Actions tab once fixed.
#
# Triggered by curated_titles.yml only, and it commits publications.yml only, so
# it cannot retrigger itself.

name: Rebuild curated publications

on:
  push:
    branches: [main]
    paths: [scripts/curated_titles.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-publications
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild _data/publications.yml from PubMed
        run: |
          python scripts/enrich_publications.py | tee "$RUNNER_TEMP/enrich.log"
          echo '## Curated publications rebuild' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/enrich.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q "need attention" "$RUNNER_TEMP/enrich.log"; then
            echo "::error::Some titles did not resolve against PubMed; not committing. See the log above."
            exit 1
          fi

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "Publications already current; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Rebuild curated publications from PubMed

          Triggered by a change to scripts/curated_titles.yml.
          Generated by .github/workflows/enrich-publications.yml."
          git push
