# Keeps the repository index on the Tools page current.
#
# _data/repos.yml records a last-push date and a language for each of the org's
# repositories. Both go stale the moment anyone pushes anywhere, and neither is
# worth anyone's attention by hand, so this refreshes them from the GitHub API
# and commits the result. Editorial fields — category, desc — are never touched.
#
# Runs on a schedule rather than on pushes to the other repositories: catching
# those would mean installing a dispatch workflow in all 24 of them, which is a
# lot of moving parts for a date on a page. A daily pass means the index is at
# most a day behind.
#
# The same daily pass refreshes _data/presentations.yml — the conference posters
# and talks shared in LaBGAScore's conference_presentations/ folder, shown on the
# Team page — so a newly pushed PDF appears within a day.
#
# Pushing to main here triggers the usual Pages rebuild. The workflow does not
# run on push, so it cannot retrigger itself.

name: Refresh repository index and conference presentations

on:
  schedule:
    # 05:17 UTC daily — off the hour, where Actions is less congested.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-repo-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh _data/repos.yml
        env:
          # Lifts the API rate limit from 60/hour to 1000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '## Repository index refresh' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/refresh_repos.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh _data/presentations.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '## Conference presentations refresh' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/refresh_presentations.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          if ! git diff --quiet -- _data/repos.yml; then
            git add _data/repos.yml
            git commit -m "Refresh repository index from the GitHub API

          Last-push dates and languages only; category and desc are editorial
          and left alone. Generated by .github/workflows/refresh-repo-index.yml."
            changed=true
          fi
          # git diff misses a file that does not exist yet, so ask git status.
          if [ -n "$(git status --porcelain -- _data/presentations.yml)" ]; then
            git add _data/presentations.yml
            git commit -m "Refresh conference presentations from LaBGAScore

          Generated by .github/workflows/refresh-repo-index.yml from
          LaBGAScore's conference_presentations/ folder."
            changed=true
          fi
          if [ "$changed" = false ]; then
            echo "Everything already current; nothing to commit."
            exit 0
          fi
          git push
